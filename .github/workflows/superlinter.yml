---
name: Super-Linter

on: push

permissions:
  contents: read
  statuses: write  # <-- Ini untuk memperbaiki error 403

jobs:
  super-lint:
    name: Lint code base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Super-Linter
        uses: super-linter/super-linter@v6
        env:
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CHECKOV: false   # <-- Mematikan linter Checkov (Kubernetes YAML)
          VALIDATE_MARKDOWN: false  # <-- Mematikan linter Markdown (File Blog)
